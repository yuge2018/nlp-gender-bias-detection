name: contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/automation/test_auto_merge.cjs
      - run: python -m src.data --mock --output-dir runs/p1-smoke
      - run: python -m src.baseline --mock --output-dir runs/p2-smoke
      - run: python -m src.improved --mock --output-dir runs/p3-smoke
      - run: python -m src.evaluation --mock --output-dir runs/p4-smoke
      - run: python -m src.fairness --mock --output-dir runs/p5-smoke
      - run: python -m src.demo --mock --output-dir runs/p6-smoke
  baseline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/p2.txt
      - run: python -m pip install -r requirements/p2.txt
      - run: python -c "import numpy, sklearn; print(numpy.__version__, sklearn.__version__)"
      - run: python -m unittest discover -s tests/p2 -v
  interfaces:
    if: always()
    needs: [contract-tests, baseline-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require contract checks and real CPU model tests
        env:
          CONTRACT_RESULT: ${{ needs.contract-tests.result }}
          BASELINE_RESULT: ${{ needs.baseline-tests.result }}
        run: |
          test "$CONTRACT_RESULT" = success
          test "$BASELINE_RESULT" = success
