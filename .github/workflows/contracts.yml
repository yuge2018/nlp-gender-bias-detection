name: contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/automation/test_auto_merge.cjs
      - run: python -m src.data --mock --output-dir runs/p1-smoke
      - run: python -m src.baseline --mock --output-dir runs/p2-smoke
      - run: python -m src.improved --mock --output-dir runs/p3-smoke
      - run: python -m src.evaluation --mock --output-dir runs/p4-smoke
      - run: python -m src.fairness --mock --output-dir runs/p5-smoke
      - run: python -m src.demo --mock --output-dir runs/p6-smoke
